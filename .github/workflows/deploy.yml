name: Deploy to VPS (Caddy)

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Deploy to VPS via SSH
        uses: appleboy/scp-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          source: "dist/*"
          target: "${{ secrets.VPS_DEPLOY_PATH || '/srv/www' }}"
          strip_components: 1

      - name: Set server env and reload services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            cat > /opt/infosecure/.env << EOF
            GITHUB_PAT=${{ secrets.GITHUB_PAT }}
            GITHUB_REPO=${{ secrets.GITHUB_REPO }}
            EOF
            docker compose -C /opt/infosecure/docker-compose.yml up -d --build
